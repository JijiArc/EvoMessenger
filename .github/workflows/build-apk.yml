name: Build debug APK

# Builds the debuggable APK in the cloud so no local Android setup is needed.
# Runs on every push to the Purple Messenger Lite branch, and on demand from the Actions tab.
on:
  push:
    branches: [purple-messenger-lite]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # The Android Gradle Plugin used by this project (7.2.1) needs JDK 11.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-32 build-tools;32.0.0'

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: purple-messenger-lite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # If the build fails, keep the Gradle reports so the errors are easy to read.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
